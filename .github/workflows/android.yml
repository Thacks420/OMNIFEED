name: Android runtime smoke
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
      OMNIFEED_LOCAL_HTTP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run build:api
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            REDDIT_CLIENT_ID=fixture REDDIT_CLIENT_SECRET=fixture YOUTUBE_API_KEY=fixture node --require ./scripts/provider-fixtures.cjs apps/api/dist/main.js > api-smoke.log 2>&1 &
            python scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            android-evidence
            api-smoke.log
          if-no-files-found: ignore
