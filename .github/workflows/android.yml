name: Android runtime smoke
on:
  pull_request:
    paths-ignore: ['**/*.md']
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
      OMNIFEED_LOCAL_HTTP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run build:api
      # Reuse the already compiled APK only when every app/API input and native build setting matches.
      # Missing/expired artifacts fall back to a fresh native build.
      - name: Check identical APK inputs
        id: reuse
        shell: bash
        run: |
          if git diff --quiet 803618d62aa996fd0c39ee2e5f4da205205b2939 HEAD -- apps packages package.json package-lock.json scripts/provider-fixtures.cjs; then
            git show 803618d62aa996fd0c39ee2e5f4da205205b2939:.github/workflows/android.yml > /tmp/apk-source-workflow.yml
            python scripts/check-apk-settings.py /tmp/apk-source-workflow.yml .github/workflows/android.yml >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        id: apk
        if: steps.reuse.outputs.identical == 'true'
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: 39203777090
          name: android-smoke-evidence
          path: .
      - run: npx expo prebuild --platform android --no-install
        if: steps.apk.outcome != 'success' 
        working-directory: apps/mobile
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
        if: steps.apk.outcome != 'success'
        working-directory: apps/mobile/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            REDDIT_CLIENT_ID=fixture REDDIT_CLIENT_SECRET=fixture YOUTUBE_API_KEY=fixture node --require ./scripts/provider-fixtures.cjs apps/api/dist/main.js > api-smoke.log 2>&1 &
            python scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            android-evidence
            api-smoke.log
          if-no-files-found: ignore
